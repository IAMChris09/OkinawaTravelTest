<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌺 ㄚ北專屬沖繩旅遊規劃站</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --primary: #0077b6;
      --secondary: #00b4d8;
      --accent: #ffb703;
      --purple: #8e44ad;
      --green: #2a9d8f;
      --danger: #dc3545;
      --bg: #f4f9fd;
      --border: #dbe4ea;
      --text: #263238;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1680px; margin: 0 auto; padding: 18px; }
    .topbar {
      display: flex; gap: 12px; align-items: center; justify-content: space-between;
      flex-wrap: wrap; margin-bottom: 16px;
    }
    .topbar h1 { margin: 0; color: var(--primary); font-size: 26px; }
    .topbar .trip-summary { color: var(--muted); font-size: 14px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(310px, 0.85fr) minmax(400px, 1.15fr) minmax(430px, 1.25fr);
      gap: 16px;
    }
    .card {
      background: white; border-radius: 14px; padding: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,.06); border-top: 6px solid var(--primary);
    }
    .card h2, .card h3 { margin: 0 0 12px; color: var(--primary); }
    .card.ai { border-top-color: var(--purple); }
    .card.map-card { border-top-color: var(--green); }
    .card.list-card { border-top-color: var(--accent); }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 700; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 10px; background: #fff; color: var(--text);
    }
    textarea { resize: vertical; min-height: 70px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .btn {
      border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 700;
      background: var(--primary); color: white;
    }
    .btn.secondary { background: #64748b; }
    .btn.success { background: var(--green); }
    .btn.warning { background: #f59e0b; }
    .btn.danger { background: var(--danger); }
    .btn.purple { background: var(--purple); }
    .btn.light { background: #e8eef2; color: #334155; }
    .btn.small { padding: 5px 8px; font-size: 12px; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .status { display: none; padding: 9px 10px; border-radius: 8px; font-size: 13px; }
    .status.ok { display: block; background: #dcfce7; color: #166534; }
    .status.err { display: block; background: #fee2e2; color: #991b1b; }
    .status.wait { display: block; background: #fef3c7; color: #92400e; }

    .filters { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .tab {
      white-space: nowrap; border: 0; border-radius: 999px; padding: 7px 11px;
      background: #edf2f7; color: #475569; font-weight: 700; font-size: 12px;
    }
    .tab.active { background: var(--primary); color: white; }
    .list { max-height: 610px; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; }
    .place {
      border: 1px solid var(--border); border-left: 5px solid var(--secondary);
      border-radius: 10px; padding: 10px; background: #fbfdff;
    }
    .place-title { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .place-title strong { font-size: 15px; }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .badge { font-size: 11px; background: #edf2f7; border-radius: 999px; padding: 3px 7px; }
    .badge.must { background: #fee2e2; color: #991b1b; }
    .badge.want { background: #fef3c7; color: #92400e; }
    .place-note { margin-top: 7px; font-size: 12px; color: #475569; white-space: pre-wrap; }
    .place-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

    #map { height: 485px; border-radius: 10px; border: 1px solid var(--border); }
    .map-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .weather { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .weather-day { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 7px; font-size: 11px; text-align: center; }

    .wide { margin-top: 16px; }
    .itinerary-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
    .days { display: grid; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); gap: 10px; }
    .day {
      border: 1px solid var(--border); background: #fff; border-radius: 12px; min-height: 180px; overflow: hidden;
    }
    .day-head {
      display: flex; justify-content: space-between; align-items: center;
      background: #f1f5f9; padding: 9px 10px; font-weight: 800;
    }
    .day-body { padding: 8px; display: flex; flex-direction: column; gap: 7px; min-height: 135px; }
    .stop {
      border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: #fff;
      display: grid; grid-template-columns: 58px 1fr auto; gap: 7px; align-items: center;
    }
    .stop input { padding: 5px; font-size: 12px; }
    .stop-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .dragging { opacity: .45; }
    .drop-target { background: #eff6ff; }

    .ai-output {
      display: none; white-space: pre-wrap; background: #faf5ff; border-left: 4px solid var(--purple);
      padding: 10px; border-radius: 8px; font-size: 13px; line-height: 1.55; max-height: 260px; overflow: auto;
    }
    .ai-output.show { display: block; }
    .expense-list { max-height: 220px; overflow: auto; font-size: 13px; }
    .expense-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eef2f7; }
    .money-total { font-weight: 800; color: var(--primary); }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,.42); display: none;
      align-items: center; justify-content: center; z-index: 9999; padding: 15px;
    }
    .modal-backdrop.show { display: flex; }
    .modal { width: min(720px, 100%); max-height: 92vh; overflow: auto; background: white; border-radius: 14px; padding: 18px; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .modal-head h3 { margin: 0; }
    .close { border: 0; background: transparent; font-size: 22px; }
    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr 1fr; }
      .map-card { grid-column: 1 / -1; }
    }
    @media (max-width: 760px) {
      .app { padding: 10px; }
      .layout { grid-template-columns: 1fr; }
      .map-card { grid-column: auto; }
      .form-grid, .filters { grid-template-columns: 1fr; }
      .weather { grid-template-columns: repeat(2, 1fr); }
      #map { height: 390px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1>🌺 沖繩 AI 旅遊規劃站</h1>
      <div class="trip-summary" id="tripSummary">載入旅程資料中…</div>
    </div>
    <button class="btn light" onclick="reloadAll()">↻ 重新同步</button>
  </div>

  <div class="layout">
    <!-- 左：新增 + AI -->
    <div class="stack">
      <section class="card">
        <h2>📍 景點資料</h2>
        <form id="placeForm">
          <input type="hidden" id="placeId">
          <div class="form-grid">
            <div class="form-group">
              <label>分類</label>
              <select id="category" required>
                <option>🍽️ 美食（食）</option>
                <option>🏨 住宿（住）</option>
                <option>🚗 交通（行）</option>
                <option>📸 景點（遊）</option>
                <option>🛍️ 購物/玩樂（玩）</option>
              </select>
            </div>
            <div class="form-group">
              <label>地區</label>
              <select id="area">
                <option value="">未分類</option>
                <option>北部</option><option>中部</option><option>南部</option>
                <option>那霸</option><option>離島</option><option>其他</option>
              </select>
            </div>
            <div class="form-group full">
              <label>名稱 *</label>
              <input id="title" required placeholder="例如：沖繩美麗海水族館">
            </div>
            <div class="form-group full">
              <label>地址 / 關鍵字</label>
              <div class="row">
                <input id="address" placeholder="例如：沖縄美ら海水族館">
                <button type="button" class="btn light" style="flex:0 0 auto" onclick="geocodePlace()">查座標</button>
              </div>
            </div>
            <div class="form-group">
              <label>緯度</label>
              <input id="lat" type="number" step="any" placeholder="26.6943">
            </div>
            <div class="form-group">
              <label>經度</label>
              <input id="lng" type="number" step="any" placeholder="127.8779">
            </div>
            <div class="form-group">
              <label>優先度</label>
              <select id="priority">
                <option value="3">⭐⭐⭐ 必去</option>
                <option value="2" selected>⭐⭐ 想去</option>
                <option value="1">⭐ 有時間再去</option>
              </select>
            </div>
            <div class="form-group">
              <label>停留時間（分鐘）</label>
              <input id="duration" type="number" min="0" step="15" value="60">
            </div>
            <div class="form-group">
              <label>營業時間</label>
              <input id="openingHours" placeholder="09:00-18:00">
            </div>
            <div class="form-group">
              <label>休息日</label>
              <input id="closedDay" placeholder="例如：週三">
            </div>
            <div class="form-group">
              <label>預估費用（日圓）</label>
              <input id="price" type="number" min="0" step="1">
            </div>
            <div class="form-group">
              <label>預約</label>
              <select id="reservation">
                <option value="否">否</option><option value="建議">建議</option><option value="需要">需要</option>
              </select>
            </div>
            <div class="form-group full">
              <label>網址</label>
              <input id="url" type="url" placeholder="https://...">
            </div>
            <div class="form-group full">
              <label>備註</label>
              <textarea id="note" placeholder="餐點、停車、想買的東西、注意事項…"></textarea>
            </div>
          </div>
          <div class="hint">💡 也可以直接點右側地圖，自動填入經緯度。</div>
          <div class="row" style="margin-top:10px">
            <button class="btn" id="savePlaceBtn" type="submit">＋ 新增景點</button>
            <button class="btn light" id="cancelEditBtn" type="button" onclick="resetPlaceForm()" style="display:none">取消修改</button>
          </div>
          <div id="placeStatus" class="status"></div>
        </form>
      </section>

      <section class="card ai">
        <h2>🤖 Gemini 行程助理</h2>
        <textarea id="aiQuestion" placeholder="例如：幫我排 4 天行程，北部放一起、必去景點優先，每天不要太趕。"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn purple" id="aiBtn" onclick="askAI()">✨ AI 規劃</button>
          <button class="btn light" onclick="applyAIPlan()" id="applyAiBtn" disabled>套用行程</button>
          <button class="btn purple" onclick="reviewPlacesWithAI()"> 🔍 AI 景點健檢</button>
        </div>
        <div class="hint" style="margin-top:6px">AI 只會使用目前收藏的景點，不會自行新增陌生景點；回傳的每日行程可一鍵套用。</div>
        <div id="aiOutput" class="ai-output"></div>
      </section>
    </div>

    <!-- 中：清單 -->
    <section class="card list-card">
      <h2>📝 景點清單</h2>
      <div class="filters">
        <input id="searchInput" placeholder="🔎 搜尋名稱 / 備註…" oninput="renderPlaces()">
        <select id="areaFilter" onchange="renderPlaces()">
          <option value="">全部地區</option><option>北部</option><option>中部</option>
          <option>南部</option><option>那霸</option><option>離島</option><option>其他</option>
        </select>
        <select id="priorityFilter" onchange="renderPlaces()">
          <option value="">全部優先度</option><option value="3">必去</option>
          <option value="2">想去</option><option value="1">有時間再去</option>
        </select>
      </div>
      <div class="tabs" id="categoryTabs"></div>
      <div id="listLoading" class="hint">同步中…</div>
      <div class="list" id="placeList"></div>
    </section>

    <!-- 右：地圖、天氣、Trip -->
    <div class="stack">
      <section class="card map-card">
        <h2>🗺️ 地圖與路線</h2>
        <div id="map"></div>
        <div class="map-tools">
          <select id="routeDay"></select>
          <button class="btn success" onclick="drawSelectedDayRoute()">🚗 畫出當日路線</button>
          <button class="btn light" onclick="clearRoute()">清除路線</button>
          <button class="btn light" onclick="fitAllMarkers()">顯示全部景點</button>
        </div>
        <div class="hint" id="routeInfo" style="margin-top:6px">可選擇某一天，在地圖上依行程順序畫出駕車路線。</div>
        <div class="weather" id="weatherBox"></div>
        <button class="btn light" style="margin-top:8px;width:100%" onclick="loadWeather()">☀ 更新沖繩 7 天天氣</button>
      </section>

      <section class="card">
        <h2>✈️ 旅程設定</h2>
        <div class="form-grid">
          <div class="form-group full"><label>旅程名稱</label><input id="tripName" value="沖繩自由行"></div>
          <div class="form-group"><label>開始日期</label><input id="tripStart" type="date"></div>
          <div class="form-group"><label>結束日期</label><input id="tripEnd" type="date"></div>
          <div class="form-group full"><label>住宿 / 基地</label><input id="tripHotel" placeholder="例如：那霸市區飯店"></div>
          <div class="form-group full"><label>備註</label><textarea id="tripNote"></textarea></div>
        </div>
        <button class="btn" style="width:100%;margin-top:8px" onclick="saveTrip()">儲存旅程設定</button>
      </section>

      <section class="card">
        <h2>💰 預算 / 支出</h2>
        <div class="row">
          <input id="expenseName" placeholder="項目">
          <input id="expenseAmount" type="number" min="0" placeholder="JPY">
        </div>
        <div class="row" style="margin-top:6px">
          <select id="expenseCategory">
            <option>餐飲</option><option>交通</option><option>住宿</option><option>門票</option><option>購物</option><option>其他</option>
          </select>
          <button class="btn" onclick="addExpense()">＋ 新增</button>
        </div>
        <div class="expense-list" id="expenseList"></div>
        <div style="margin-top:8px">總計：<span id="expenseTotal" class="money-total">¥0</span></div>
      </section>
    </div>
  </div>

  <!-- 每日行程 -->
  <section class="card wide">
    <h2>📅 每日行程</h2>
    <div class="itinerary-toolbar">
      <label>天數：</label>
      <select id="dayCount" style="width:auto" onchange="changeDayCount()"></select>
      <button class="btn light" onclick="buildDays()">重新整理</button>
      <button class="btn success" onclick="saveItinerary()">💾 儲存行程</button>
      <span class="hint">景點清單可按「加入 Day」，行程內可拖曳排序；修改時間後再按儲存。</span>
    </div>
    <div id="days" class="days"></div>
    <div id="itineraryStatus" class="status" style="margin-top:10px"></div>
  </section>
</div>

<!-- 編輯支出/其他未來擴充可沿用 modal -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle">編輯</h3><button class="close" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  // ====== 必填：部署完成後換成你的 Google Apps Script Web App URL ======
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz3LM51tO3BkHC83Ve11y2-bBLCYj8qpxA5YBUSDg_K7n5406BBh02Evt3smN9MEVqJEg/exec';

  const CATEGORY_ALL = 'All';
  const CATEGORIES = ['🍽️ 美食（食）','🏨 住宿（住）','🚗 交通（行）','📸 景點（遊）','🛍️ 購物/玩樂（玩）'];
  const DAY_COLORS = ['#2563eb','#16a34a','#ea580c','#9333ea','#0891b2','#db2777','#4f46e5','#65a30d'];

  let state = {
    places: [],
    itinerary: [],
    trip: {},
    expenses: [],
    category: CATEGORY_ALL,
    dayCount: 4,
    aiPlan: null
  };

  let map, markers = new Map(), routeLayer = null;
  let dragPayload = null;

  window.addEventListener('load', async () => {
    initCategoryTabs();
    initDayCount();
    initMap();
    await reloadAll();
    loadWeather();
  });

  function apiUrl(action, params = {}) {
    const u = new URL(GAS_WEB_APP_URL);
    if (action) u.searchParams.set('action', action);
    Object.entries(params).forEach(([k,v]) => u.searchParams.set(k, v));
    return u.toString();
  }

  async function apiGet(action = 'bootstrap', params = {}) {
    if (GAS_WEB_APP_URL.includes('PASTE_YOUR_')) throw new Error('請先設定 GAS_WEB_APP_URL');
    const r = await fetch(apiUrl(action, params));
    const data = await r.json();
    if (!r.ok || data.result === 'error') throw new Error(data.message || 'API 失敗');
    return data;
  }

  async function apiPost(action, payload = {}) {
    if (GAS_WEB_APP_URL.includes('PASTE_YOUR_')) throw new Error('請先設定 GAS_WEB_APP_URL');
    const r = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, ...payload })
    });
    const data = await r.json();
    if (!r.ok || data.result === 'error') throw new Error(data.message || 'API 失敗');
    return data;
  }

  async function reloadAll() {
    setText('listLoading', '同步中…');
    try {
      const data = await apiGet('bootstrap');
      state.places = data.places || [];
      state.itinerary = data.itinerary || [];
      state.trip = data.trip || {};
      state.expenses = data.expenses || [];
      inferDayCount();
      loadTripIntoForm();
      renderPlaces();
      buildDays();
      renderExpenses();
      renderRouteDayOptions();
      updateTripSummary();
      setText('listLoading', '');
    } catch (e) {
      setText('listLoading', '❌ 同步失敗：' + e.message);
    }
  }

  // ---------- MAP ----------
  function initMap() {
    map = L.map('map').setView([26.3344, 127.8056], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    map.on('click', e => {
      document.getElementById('lat').value = e.latlng.lat.toFixed(6);
      document.getElementById('lng').value = e.latlng.lng.toFixed(6);
    });
  }

  function validCoords(p) {
      if (!p) return false;
  
      // 空白座標不能當作 0
      if (
          p.lat === '' ||
          p.lat === null ||
          p.lat === undefined ||
          p.lng === '' ||
          p.lng === null ||
          p.lng === undefined
      ) {
          return false;
      }
  
      const lat = Number(p.lat);
      const lng = Number(p.lng);
  
      return (
          Number.isFinite(lat) &&
          Number.isFinite(lng) &&
          lat >= -90 &&
          lat <= 90 &&
          lng >= -180 &&
          lng <= 180
      );
  }

  function refreshMarkers(places) {
    markers.forEach(m => map.removeLayer(m));
    markers.clear();
    const points = [];
    places.forEach(p => {
      if (!validCoords(p)) return;
      const popup = document.createElement('div');
      const title = document.createElement('strong');
      title.textContent = p.title;
      popup.appendChild(title);
      const meta = document.createElement('div');
      meta.textContent = `${p.area || '未分類'} · ${priorityText(p.priority)}`;
      popup.appendChild(meta);
      if (p.note) {
        const note = document.createElement('div');
        note.style.marginTop = '4px';
        note.textContent = p.note;
        popup.appendChild(note);
      }
      const marker = L.marker([Number(p.lat), Number(p.lng)]).addTo(map).bindPopup(popup);
      markers.set(p.id, marker);
      points.push([Number(p.lat), Number(p.lng)]);
    });
    return points;
  }

  function focusPlace(id) {
    const p = state.places.find(x => x.id === id);
    if (!p || !validCoords(p)) return alert('此景點尚未設定有效座標');
    map.setView([Number(p.lat), Number(p.lng)], 15, {animate:true});
    markers.get(id)?.openPopup();
  }

  function fitAllMarkers() {
    const pts = state.places.filter(validCoords).map(p => [Number(p.lat), Number(p.lng)]);

    map.fitBounds(pts, {padding:[25,25]});
  }

  async function geocodePlace() {
    const q = document.getElementById('address').value.trim() || document.getElementById('title').value.trim();
    if (!q) return alert('請先輸入地址或地點名稱');
    setStatus('placeStatus', 'wait', '正在查詢地址…');
    try {
      const r = await apiPost('geocode', { query: q });
      document.getElementById('lat').value = r.lat;
      document.getElementById('lng').value = r.lng;
      document.getElementById('address').value = r.formattedAddress || q;
      map.setView([Number(r.lat), Number(r.lng)], 15);
      setStatus('placeStatus', 'ok', '✅ 已取得座標');
    } catch (e) {
      setStatus('placeStatus', 'err', '❌ ' + e.message);
    }
  }

  async function drawSelectedDayRoute() {
    const day = Number(document.getElementById('routeDay').value);
    const stops = state.itinerary
      .filter(x => Number(x.day) === day)
      .sort((a,b) => Number(a.order) - Number(b.order))
      .map(x => state.places.find(p => p.id === x.placeId))
      .filter(p => p && validCoords(p));

    if (stops.length < 2) return alert('這一天至少需要 2 個有座標的景點');
    clearRoute();

    const coords = stops.map(p => `${p.lng},${p.lat}`).join(';');
    const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`;
    setText('routeInfo', '路線計算中…');
    try {
      const r = await fetch(url);
      const data = await r.json();
      if (!data.routes?.length) throw new Error('OSRM 沒有回傳路線');
      routeLayer = L.geoJSON(data.routes[0].geometry, {weight:5}).addTo(map);
      map.fitBounds(routeLayer.getBounds(), {padding:[25,25]});
      const km = (data.routes[0].distance / 1000).toFixed(1);
      const min = Math.round(data.routes[0].duration / 60);
      setText('routeInfo', `Day ${day}：約 ${km} km / ${min} 分鐘（不含停留與即時路況）`);
    } catch (e) {
      const latlngs = stops.map(p => [Number(p.lat), Number(p.lng)]);
      routeLayer = L.polyline(latlngs, {weight:4, dashArray:'6 6'}).addTo(map);
      map.fitBounds(routeLayer.getBounds());
      setText('routeInfo', '⚠️ 路線服務暫時無法使用，已改畫景點連線。');
    }
  }

  function clearRoute() {
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = null;
    setText('routeInfo', '可選擇某一天，在地圖上依行程順序畫出駕車路線。');
  }

  // ---------- ITINERARY ----------
  function initDayCount() {
    const s = document.getElementById('dayCount');
    for (let i=1;i<=10;i++) {
      const o = document.createElement('option'); o.value=i; o.textContent=`${i} 天`; if (i===4) o.selected=true;
      s.appendChild(o);
    }
  }

  function inferDayCount() {
    const maxDay = Math.max(0, ...state.itinerary.map(x => Number(x.day)||0));
    const tripDays = calculateTripDays();
    state.dayCount = Math.min(10, Math.max(1, maxDay, tripDays || 4));
    document.getElementById('dayCount').value = String(state.dayCount);
  }

  function changeDayCount() {
    state.dayCount = Number(document.getElementById('dayCount').value);
    state.itinerary = state.itinerary.filter(x => Number(x.day) <= state.dayCount);
    normalizeItinerary();
    buildDays(); renderPlaces(); renderRouteDayOptions();
  }

  function addPlaceToDay(placeId, day) {
    if (state.itinerary.some(x => x.placeId === placeId && Number(x.day) === day)) {
      return alert('這個景點已經在該天行程中');
    }
    const order = state.itinerary.filter(x => Number(x.day) === day).length + 1;
    state.itinerary.push({ id: crypto.randomUUID?.() || `${Date.now()}_${Math.random()}`, day, order, placeId, startTime:'', note:'' });
    normalizeItinerary();
    buildDays();
  }

  function buildDays() {
    const days = document.getElementById('days');
    days.innerHTML = '';
    for (let d=1; d<=state.dayCount; d++) {
      const day = document.createElement('div'); day.className = 'day';
      const head = document.createElement('div'); head.className = 'day-head';
      head.innerHTML = `<span>Day ${d}</span><span style="font-size:11px;color:#64748b">${dayDateLabel(d)}</span>`;
      day.appendChild(head);

      const body = document.createElement('div');
      body.className = 'day-body';
      body.dataset.day = d;
      body.ondragover = e => { e.preventDefault(); body.classList.add('drop-target'); };
      body.ondragleave = () => body.classList.remove('drop-target');
      body.ondrop = e => handleDrop(e, d);

      const items = state.itinerary.filter(x => Number(x.day) === d).sort((a,b)=>Number(a.order)-Number(b.order));
      items.forEach(item => body.appendChild(renderStop(item)));

      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'hint'; empty.textContent = '從景點清單加入，或套用 AI 規劃'; empty.style.padding='14px';
        body.appendChild(empty);
      }
      day.appendChild(body);
      days.appendChild(day);
    }
  }

  function renderStop(item) {
    const p = state.places.find(x => x.id === item.placeId);
    const el = document.createElement('div');
    el.className = 'stop';
    el.draggable = true;
    el.dataset.itemId = item.id;
    el.ondragstart = () => { dragPayload = item.id; el.classList.add('dragging'); };
    el.ondragend = () => { dragPayload = null; el.classList.remove('dragging'); };

    const time = document.createElement('input');
    time.type = 'time'; time.value = item.startTime || '';
    time.onchange = () => item.startTime = time.value;

    const info = document.createElement('div');
    const name = document.createElement('strong'); name.textContent = p?.title || '(景點已刪除)';
    info.appendChild(name);
    const meta = document.createElement('div'); meta.className='stop-meta';
    meta.textContent = p ? `${p.area || '未分類'} · ${p.duration || 0} 分鐘` : '';
    info.appendChild(meta);

    const acts = document.createElement('div');
    acts.style.display='flex'; acts.style.gap='3px';
    acts.append(
      actionBtn('↑','light',()=>moveStop(item.id,-1)),
      actionBtn('↓','light',()=>moveStop(item.id,1)),
      actionBtn('×','danger',()=>removeStop(item.id))
    );

    el.append(time, info, acts);
    return el;
  }

  function handleDrop(e, targetDay) {
    e.preventDefault();
    e.currentTarget.classList.remove('drop-target');
    if (!dragPayload) return;
    const item = state.itinerary.find(x => x.id === dragPayload);
    if (!item) return;
    item.day = targetDay;
    item.order = state.itinerary.filter(x => Number(x.day) === targetDay && x.id !== item.id).length + 1;
    normalizeItinerary();
    buildDays();
  }

  function moveStop(id, delta) {
    const item = state.itinerary.find(x => x.id === id); if (!item) return;
    const same = state.itinerary.filter(x => Number(x.day)===Number(item.day)).sort((a,b)=>a.order-b.order);
    const idx = same.findIndex(x => x.id===id);
    const target = idx + delta;
    if (target < 0 || target >= same.length) return;
    [same[idx].order, same[target].order] = [same[target].order, same[idx].order];
    normalizeItinerary(); buildDays();
  }

  function removeStop(id) {
    state.itinerary = state.itinerary.filter(x => x.id !== id);
    normalizeItinerary(); buildDays();
  }

  function normalizeItinerary() {
    for (let d=1; d<=state.dayCount; d++) {
      state.itinerary
        .filter(x => Number(x.day)===d)
        .sort((a,b)=>Number(a.order)-Number(b.order))
        .forEach((x,i)=>x.order=i+1);
    }
  }

  async function saveItinerary() {
    setStatus('itineraryStatus','wait','儲存中…');
    try {

      await apiPost('saveItinerary', { itinerary: state.itinerary });
      setStatus('itineraryStatus','ok','✅ 行程已儲存');

    }
  }

  // ---------- AI ----------
  async function askAI() {
    const q = val('aiQuestion').trim();
    if (!q) return alert('請輸入想讓 AI 規劃的內容');
    const btn = document.getElementById('aiBtn');
    btn.disabled = true; setText('aiBtn','AI 規劃中…');
    const out = document.getElementById('aiOutput');
    out.classList.add('show'); out.textContent = '正在分析你的收藏景點…';
    document.getElementById('applyAiBtn').disabled = true;
    try {
      const contextPlaces = chooseAIContext(q);
      const r = await apiPost('planAI', {
        question: q,
        dayCount: state.dayCount,
        trip: state.trip,
        places: contextPlaces
      });
      state.aiPlan = r.plan || null;
      out.textContent = r.reply || formatAIPlan(state.aiPlan);
      document.getElementById('applyAiBtn').disabled = !state.aiPlan?.days?.length;
    } catch (e) {
      out.textContent = '❌ ' + e.message;
      state.aiPlan = null;
    } finally {
      btn.disabled = false; setText('aiBtn','✨ AI 規劃');
    }
  }

  function chooseAIContext(question) {
    // 簡單前置篩選：若問題明確提到地區，就只送該地區 + 必去景點，否則送全部。
    const areas = ['北部','中部','南部','那霸','離島'];
    const mentioned = areas.filter(a => question.includes(a));
    if (!mentioned.length) return state.places;
    return state.places.filter(p => mentioned.includes(p.area) || Number(p.priority) === 3);
  }

  function applyAIPlan() {
    const plan = state.aiPlan;
    if (!plan?.days?.length) return;
    const next = [];
    plan.days.forEach(dayObj => {
      (dayObj.stops || []).forEach((s, i) => {
        const place = state.places.find(p => p.id === s.placeId) || state.places.find(p => p.title === s.title);
        if (!place) return;
        next.push({
          id: crypto.randomUUID?.() || `${Date.now()}_${Math.random()}`,
          day: Number(dayObj.day),
          order: i+1,
          placeId: place.id,
          startTime: s.startTime || '',
          note: s.note || ''
        });
      });
    });
    if (!next.length) return alert('AI 回傳內容找不到對應景點');
    state.itinerary = next;
    state.dayCount = Math.max(state.dayCount, ...next.map(x=>Number(x.day)));
    document.getElementById('dayCount').value = state.dayCount;
    normalizeItinerary(); buildDays(); renderRouteDayOptions();
    alert('已套用 AI 行程，確認後請按「儲存行程」');
  }

  function formatAIPlan(plan) {
    if (!plan?.days) return 'AI 沒有回傳可套用的行程。';
    return plan.days.map(d => `Day ${d.day}\n` + (d.stops||[]).map(s => `${s.startTime||'--:--'} ${s.title}`).join('\n')).join('\n\n');
  }

  function weatherCode(code) {
    if ([0].includes(code)) return '☀ 晴';
    if ([1,2].includes(code)) return '🌤 多雲';
    if ([3].includes(code)) return '☁ 陰';
    if ([45,48].includes(code)) return '🌫 霧';
    if ([51,53,55,56,57].includes(code)) return '🌦 毛毛雨';
    if ([61,63,65,66,67,80,81,82].includes(code)) return '🌧 雨';
    if ([95,96,99].includes(code)) return '⛈ 雷雨';
    return '🌥';
  }

  function loadTripIntoForm() {

  async function saveTrip() {
    const trip = {
      name: val('tripName').trim(),
      startDate: val('tripStart'),
      endDate: val('tripEnd'),
      hotel: val('tripHotel').trim(),
      note: val('tripNote').trim()
    };
    try {
      await apiPost('saveTrip', { trip });
      state.trip = trip;
      const days = calculateTripDays();
      if (days && days <= 10) {
        state.dayCount = days;
        document.getElementById('dayCount').value = days;
        buildDays(); renderRouteDayOptions(); renderPlaces();
      }
      updateTripSummary();
      alert('旅程設定已儲存');
    } catch (e) { alert(e.message); }
  }

  function calculateTripDays() {
    const a = state.trip?.startDate, b = state.trip?.endDate;
    if (!a || !b) return 0;
    const ms = new Date(b+'T00:00:00') - new Date(a+'T00:00:00');
    return ms >= 0 ? Math.floor(ms/86400000)+1 : 0;
  }

  function dayDateLabel(day) {
    if (!state.trip?.startDate) return '';
    const d = new Date(state.trip.startDate+'T00:00:00');
    d.setDate(d.getDate()+day-1);
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function updateTripSummary() {
    const t = state.trip || {};
    const date = t.startDate && t.endDate ? `${t.startDate} ～ ${t.endDate}` : '日期未設定';
    setText('tripSummary', `${t.name || '沖繩自由行'} ｜ ${date}${t.hotel ? ' ｜ '+t.hotel : ''}`);
  }

  }

  async function reviewPlacesWithAI() {
  
    const result =
      await apiPost(
        'reviewPlacesAI',
        {
          places: state.places,
          trip: state.trip
        }
      );
  
    state.aiReview =
      result.review;
  
    renderAIReview();
  }
</script>
